name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Submit EcoBottle.exe to SignPath for signing'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

jobs:
  build-sign-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MSYS2 ships a current MinGW-w64 GCC and the SDL2 development package,
      # so the CI build uses the same toolchain family as the local build.
      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2

      - name: Build EcoBottle.exe
        shell: msys2 {0}
        run: |
          set -e
          windres app.rc -O coff -o app.res
          g++ -std=c++17 -O2 -Wall -Wextra ecobottle.cpp app.res -o EcoBottle.exe \
              -I/mingw64/include/SDL2 -L/mingw64/lib \
              -lmingw32 -lSDL2main -lSDL2 -lgdi32 -luser32 -lole32 -luuid -ladvapi32 \
              -mwindows -static-libgcc -static-libstdc++
          rm -f app.res

      - name: Stage release files
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp EcoBottle.exe dist/
          cp /mingw64/bin/SDL2.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/
          cp LICENSE LICENSE-SDL2.txt LICENSE-winpthreads.txt README.md dist/

      # SignPath only signs artifacts that were uploaded as a workflow artifact.
      # The action stores the single exe inside a zip, so the SignPath artifact
      # configuration must use <zip-file> as its root element.
      - name: Upload unsigned executable
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.sign)
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: dist/EcoBottle.exe
          if-no-files-found: error

      - name: Submit SignPath signing request
        id: signpath
        if: env.SIGNPATH_API_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.sign)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use and verify the signed executable
        if: env.SIGNPATH_API_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.sign)
        shell: pwsh
        run: |
          if (-not (Test-Path 'signed/EcoBottle.exe')) {
            throw 'SignPath returned no signed executable'
          }
          Copy-Item 'signed/EcoBottle.exe' 'dist/EcoBottle.exe' -Force
          $sig = Get-AuthenticodeSignature 'dist/EcoBottle.exe'
          Write-Host "signature : $($sig.Status)"
          Write-Host "publisher : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "Signature is not valid: $($sig.Status)"
          }

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $tag = 'dev' }
          $zip = "Mossglass-$tag-win64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content SHA256SUMS.txt -Encoding ascii
          "ZIP_NAME=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "$zip  $hash"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            Mossglass-*.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME "$env:ZIP_NAME" SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME "$env:ZIP_NAME" SHA256SUMS.txt `
              --title "Mossglass $env:GITHUB_REF_NAME" --generate-notes
          }
